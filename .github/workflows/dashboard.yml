name: Progress snapshot
on:
  workflow_call:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: lean-ci-result
          path: .ci
      - name: Generate snapshot from this run only
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_CI_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: python3 tools/update_dashboard.py --ci-result .ci/result.json --expected-sha "$EXPECTED_SHA" --expected-ci-url "$EXPECTED_CI_URL"
      - name: Package only display assets
        run: |
          mkdir -p site-artifact
          cp docs/index.html docs/style.css docs/app.js docs/data.js site-artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: progress-dashboard
          path: site-artifact
          if-no-files-found: error
